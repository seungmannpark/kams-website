<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="format-detection" content="telephone=no, email=no, address=no">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대한의사학회 · Korean Society for the History of Medicine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500&family=Noto+Sans+KR:wght@300;400;500" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy:   #0A1545;
    --navy-dk:#060D2E;
    --sky:    #9A9A9A;
    --sky-lt: #D0D0D0;
    --sky-dk: #707070;
    --silver: #888888;
    --serif:  'Noto Serif KR', var(--serif);
    --fell:   'Noto Serif', 'Noto Serif KR', var(--serif);
  }

  html, body { height: 100%;  overflow-y: scroll; }

  body {
    background: var(--navy-dk);
    color: #fff;
    font-family: var(--serif);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    position: relative;
    overflow: hidden;
  }

  /* 배경 사진 */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("./masthead-bg.jpg");
    background-size: cover;
    background-position: center 30%;
    pointer-events: none;
    z-index: 0;
  }
  /* 오버레이 */
  body::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(6,13,46,0.82);
    background-image: repeating-linear-gradient(
      90deg, transparent, transparent 79px,
      rgba(150,150,150,0.03) 79px, rgba(150,150,150,0.03) 80px
    );
    pointer-events: none;
    z-index: 0;
  }

  /* 배경 큰 글자 */
  .bg-text {
    position: absolute;
    font-family: var(--fell); font-style: italic;
    font-size: clamp(120px, 20vw, 280px);
    color: rgba(150,150,150,0.04);
    letter-spacing: -0.02em;
    user-select: none;
    pointer-events: none;
    line-height: 1;
    bottom: -20px;
    right: 40px;
  }

  .wrap {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 0;
    padding: 0 24px;
  }

  .est {
    font-family: var(--fell); font-style: italic;
    font-size: 11px;
    color: var(--sky);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .name-ko {
    font-family: var(--serif);
    font-weight: 300;
    font-size: clamp(28px, 5vw, 52px);
    letter-spacing: 0.1em;
    margin-bottom: 10px;
    line-height: 1.2;
  }

  .name-en {
    font-family: var(--fell); font-style: italic;
    font-size: clamp(13px, 2vw, 17px);
    color: var(--sky-lt);
    letter-spacing: 0.04em;
    margin-bottom: 64px;
  }

  /* 구분선 */
  .divider {
    width: 1px;
    height: 48px;
    background: linear-gradient(to bottom, transparent, rgba(150,150,150,0.30), transparent);
    margin-bottom: 64px;
  }


  /* 두 버튼 */
  .choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: rgba(150,150,150,0.15);
    border: 1px solid rgba(150,150,150,0.15);
    width: min(640px, 90vw);
  }

  .choice {
    background: rgba(10,21,69,0.60);
    padding: 40px 36px;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: background 0.2s;
    position: relative;
    overflow: hidden;
  }
  .choice::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: #C2CBD3;
    transform: scaleX(0);
    transition: transform 0.25s ease;
  }
  .choice:hover { background: rgba(10,21,69,0.90); }
  .choice:hover::after { transform: scaleX(1); }

  .choice-tag {
    font-family: var(--fell); font-style: italic;
    font-size: 10px;
    color: var(--sky-dk);
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .choice-name {
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(16px, 2.5vw, 22px);
    color: #fff;
    letter-spacing: 0.04em;
    line-height: 1.3;
  }
  .choice-desc {
    font-family: var(--serif);
    font-weight: 300;
    font-size: 12px;
    color: rgba(150,150,150,0.55);
    line-height: 1.6;
    margin-top: 4px;
  }
  .choice-arrow {
    font-family: var(--fell); font-style: italic;
    font-size: 16px;
    color: rgba(150,150,150,0.30);
    margin-top: 8px;
    transition: color 0.2s, transform 0.2s;
    display: inline-block;
  }
  .choice:hover .choice-arrow {
    color: var(--sky);
    transform: translateX(4px);
  }

  .footer-note {
    position: absolute;
    bottom: 28px;
    font-family: var(--fell); font-style: italic;
    font-size: 10.5px;
    color: rgba(245,245,245,0.30);
    letter-spacing: 0.06em;
  }

  /* 애니메이션 */
  .wrap > * {
    opacity: 0;
    transform: translateY(14px);
    animation: up 0.55s ease forwards;
  }
  .est        { animation-delay: 0.1s; }
  .name-ko    { animation-delay: 0.18s; }
  .name-en    { animation-delay: 0.24s; }
  .divider    { animation-delay: 0.32s; }
  .choices    { animation-delay: 0.38s; }
  @keyframes up { to { opacity: 1; transform: translateY(0); } }

  /* ─── MOBILE (≤768px) ─── */
  @media (max-width: 768px) {
    .header-inner { padding: 0 20px; height: 56px; }
    .site-title .en { display: none; }

    /* 햄버거 메뉴 */
    #nav-toggle { display: flex; flex-direction: column; justify-content: center; gap: 5px; width: 44px; height: 44px; background: none; border: none; cursor: pointer; padding: 8px; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .nav-toggle span { display: block; width: 100%; height: 1.5px; background: rgba(255,255,255,0.8); transition: transform 0.25s, opacity 0.25s; }
    .nav-toggle.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
    .nav-toggle.open span:nth-child(2) { opacity: 0; }
    .nav-toggle.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

    nav { display: none; position: fixed; top: 56px; left: 0; right: 0; bottom: 0; background: var(--navy-dk); flex-direction: column; overflow-y: auto; z-index: 99; padding: 16px 0 40px; }
    nav.open { display: flex; }
    .nav-item { border-bottom: 1px solid rgba(150,150,150,0.10); }
    nav > .nav-item > a { height: 52px; padding: 0 24px; font-size: 15px; border-bottom: none; margin-bottom: 0; }
    .dropdown { display: block; position: static; border-top: none; border-left: 2px solid rgba(150,150,150,0.20); margin: 0 24px 8px 36px; padding: 4px 0; background: transparent; }
    .dropdown a { padding: 7px 12px; font-size: 13px; color: rgba(255,255,255,0.55); }
    .dropdown a:hover { background: transparent; color: var(--sky-lt); }

    .masthead { padding: 40px 0 36px; }
    .masthead-inner { padding: 0 20px; grid-template-columns: 1fr; gap: 0; }
    .masthead-year { display: none; }
    .masthead-title { font-size: 32px; }
    .masthead-sub { font-size: 12px; }

    main { padding: 24px 0 48px; }
    .main-inner { padding: 0 16px; }

    .top-row { grid-template-columns: 1fr; }
    .bottom-row { grid-template-columns: 1fr; }

    .card { padding: 24px 20px; }
    .about-card { padding: 24px 20px; }
    .journal-card { padding: 24px 20px; }

    .about-stats { gap: 20px; }

    footer { padding: 28px 20px; }
    .footer-inner { grid-template-columns: 1fr; gap: 20px; }
    .footer-links { align-items: flex-start; }
  }

  @media (min-width: 769px) {
    .nav-toggle { display: none; }
  }


  @media (max-width: 768px) {
    .wrap { padding: 0 20px; }
    .name-ko { font-size: 28px; }
    .name-en { font-size: 13px; margin-bottom: 40px; }
    .divider { margin-bottom: 40px; }
    .choices { grid-template-columns: 1fr; width: 100%; }
    .choice { padding: 28px 24px; }
    .bg-text { display: none; }
  }

  .no-tel { unicode-bidi: plaintext; }
  a[href^="mailto"] { pointer-events: none; color: inherit; text-decoration: none; }
  .no-auto-link { -webkit-touch-callout: none; }
</style>
</head>
<body><div class="bg-text">1947</div>

<div class="wrap" style="position:relative;z-index:1;">
  <div class="est">Est. 1947</div>
  <h1 class="name-ko">대한의사학회</h1>
  <p class="name-en">The Korean Society for the History of Medicine</p>

  <div class="divider"></div>
  <div class="choices">
    <!-- 학회 홈페이지 -->
    <a class="choice" href="kams-homepage.html">
      <span class="choice-tag">Society</span>
      <span class="choice-name">학회 홈페이지</span>
      <span class="choice-desc">학술대회, 공지사항,<br>학회 소개 및 회원 안내</span>
      <span class="choice-arrow">→</span>
    </a>
    <!-- 학술지 홈페이지 -->
    <a class="choice" href="https://www.medhist.or.kr/journal/" target="_self">
      <span class="choice-tag">Journal</span>
      <span class="choice-name">『의사학』</span>
      <span class="choice-desc">학술지 소개, 논문 열람,<br>투고 및 심사 안내</span>
      <span class="choice-arrow">→</span>
    </a>
  </div>
</div>

<p class="footer-note">© 2025 The Korean Society for the History of Medicine</p>


<script>
(function() {
  var btn = document.getElementById('nav-toggle');
  var nav = document.getElementById('main-nav');
  if (!btn || !nav) return;
  btn.addEventListener('click', function() {
    var open = nav.classList.toggle('open');
    btn.classList.toggle('open', open);
    btn.setAttribute('aria-label', open ? '메뉴 닫기' : '메뉴 열기');
    document.body.style.overflow = open ? 'hidden' : '';
  });
  // 메뉴 링크 클릭 시 닫기
  nav.querySelectorAll('a').forEach(function(a) {
    a.addEventListener('click', function() {
      nav.classList.remove('open');
      btn.classList.remove('open');
      document.body.style.overflow = '';
    });
  });
})();
</script>

</body>
</html>
